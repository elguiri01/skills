# tmux config for Claude Code sessions.
#
# Loaded only by the `cc` helper, on its own tmux server socket (-L claude),
# so nothing here touches an existing ~/.tmux.conf or any tmux session that
# is already running on the droplet.

# Truecolor. Without this the Claude Code UI degrades to 8 colours.
# If `infocmp tmux-256color` fails on the host, use screen-256color instead.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Esc is Claude Code's interrupt key. tmux waits 500ms on it by default,
# which makes interrupting a running turn feel broken.
set -s escape-time 10

# Tool output scrolls past the 2000-line default within one batch job.
set -g history-limit 100000
set -g mouse on
setw -g mode-keys vi

# OSC passthrough. Clickable file:line links (OSC 8) and copy-to-local-
# clipboard over SSH (OSC 52) both travel through these.
set -g allow-passthrough on
set -g set-clipboard on

set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar. The session name is the project, so keep it visible and quiet.
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M "
set -g status-justify left
setw -g window-status-current-style "fg=colour214,bold"

bind R source-file ~/.config/tmux/claude.conf \; display "claude.conf reloaded"
